services:
  kiks:
    build: .
    image: kiks:latest
    restart: unless-stopped
    environment:
      SNAP_TTL_HOURS: ${SNAP_TTL_HOURS:-24}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-30}
      VIDEO_KBPS: ${VIDEO_KBPS:-6000}
      DAILY_UPLOAD_MB: ${DAILY_UPLOAD_MB:-500}
      RP_ID: ${RP_ID:-}
      # public address of the web app, only needed if your proxy rewrites the Host header
      ORIGIN: ${ORIGIN:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://github.com/robotman4/kicksnap}
      # reverse proxy address(es) uvicorn trusts for X-Forwarded-For/-Proto; see docs/deploy.md
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      # the volume keeps its old name so existing data stays put
      - kicksnap-data:/data
    ports:
      - "${PORT:-8080}:8000"

volumes:
  kicksnap-data:
