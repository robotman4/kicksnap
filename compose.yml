services:
  kicksnap:
    build: .
    image: kicksnap:latest
    restart: unless-stopped
    environment:
      SNAP_TTL_HOURS: ${SNAP_TTL_HOURS:-24}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      RP_ID: ${RP_ID:-}
    volumes:
      - kicksnap-data:/data
    ports:
      - "${PORT:-8080}:8000"

volumes:
  kicksnap-data:
